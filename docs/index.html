<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Ações</title>
<meta name="description" content="Indicadores fundamentalistas de todas as ações da B3, histórico de 20 anos e simulador de investimento com dividendos reinvestidos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra fixa com marca, busca e abas; abaixo, uma "mesa" por aba (buscador, ficha, simulador). Números em mono tabular. */
:root{
  --bg:#0d131b; --panel:#141c27; --panel2:#1a2431; --line:#253244; --fg:#e6ecf3; --muted:#8798ad; --faint:#5d6d82;
  --accent:#e8ae45; --accent-ink:#1b1305; --accent-soft:rgba(232,174,69,.14);
  --up:#3ec28f; --down:#ee6672; --up-soft:rgba(62,194,143,.13); --down-soft:rgba(238,102,114,.13);
  --s1:#e8ae45; --s2:#5aa9e6; --s3:#b48ae0; --s4:#8798ad;
  --c1:#e8ae45; --c2:#5aa9e6; --c3:#b48ae0; --c4:#3ec28f; --c5:#f08a5d; --c6:#45c4c4; --c7:#e07bb5; --c8:#a9c95b; --c9:#c9a27a; --c10:#8f9bff;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f4f7; --panel:#fff; --panel2:#eef1f5; --line:#d8dfe8; --fg:#111923; --muted:#5a687a; --faint:#8a97a8;
  --accent:#a86d06; --accent-ink:#fff; --accent-soft:rgba(168,109,6,.10);
  --up:#0d8457; --down:#c4323f; --up-soft:rgba(13,132,87,.09); --down-soft:rgba(196,50,63,.09);
  --s1:#a86d06; --s2:#2f6fb0; --s3:#7a4fb3; --s4:#6b7a8c;
  --c1:#b07a12; --c2:#2f6fb0; --c3:#7a4fb3; --c4:#12855a; --c5:#c4562a; --c6:#16858a; --c7:#b0407e; --c8:#6b8a1e; --c9:#8f6a3f; --c10:#4b55c9; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f4f7; --panel:#fff; --panel2:#eef1f5; --line:#d8dfe8; --fg:#111923; --muted:#5a687a; --faint:#8a97a8;
  --accent:#a86d06; --accent-ink:#fff; --accent-soft:rgba(168,109,6,.10);
  --up:#0d8457; --down:#c4323f; --up-soft:rgba(13,132,87,.09); --down-soft:rgba(196,50,63,.09);
  --s1:#a86d06; --s2:#2f6fb0; --s3:#7a4fb3; --s4:#6b7a8c;
  --c1:#b07a12; --c2:#2f6fb0; --c3:#7a4fb3; --c4:#12855a; --c5:#c4562a; --c6:#16858a; --c7:#b0407e; --c8:#6b8a1e; --c9:#8f6a3f; --c10:#4b55c9; color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.search input:focus{border-color:var(--accent);outline:none}
.sugs{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;z-index:9}
.sugs button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugs button:hover,.sugs button.on{background:var(--panel2)}
.sugs b{font-family:var(--f-display);min-width:64px}
nav.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
nav.tabs button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.stamp{margin-left:auto;font-size:12px;color:var(--muted)}

main{max-width:1280px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:0}
.card-b{padding:14px 16px}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--accent-soft);border:1px dashed var(--accent);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}

/* filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f{display:grid;gap:4px}
.f label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f .pair{display:flex;gap:6px}
.f .pair input{width:100%}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.sorted{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--panel2)}
.tk{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.co{font-family:var(--f-body);color:var(--muted);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tbl-scroll{max-height:68vh;overflow:auto}

/* ficha */
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.hero .name{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1}
.hero .sub{color:var(--muted);margin-top:6px}
.hero .px{font-family:var(--f-mono);font-size:30px;font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.grp h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 6px;font-weight:600}
.ind{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ind:last-child{border-bottom:0}
.ind .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ind span[title]{cursor:help;text-decoration:underline dotted var(--faint);text-underline-offset:3px}
.chart-box{position:relative;height:320px}
#ch-hist{touch-action:none;cursor:crosshair}
.selbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:13px;min-height:44px}
.selbox .it{display:grid;gap:1px}
.selbox .it small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.selbox .it b{font-family:var(--f-mono);font-weight:600}
.selbox .x{margin-left:auto}
.seg{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:5px;color:var(--muted);cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* simulador */
.sim-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.sim-form .inp{width:100%}
.sim-form .pair{display:flex;gap:6px}
.sim-form .pair select:first-child{flex:0 0 76px}
.quick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick .btn{padding:3px 8px;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:3px;min-width:0}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--f-mono);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-family:var(--f-mono);font-size:12px}
.cart{display:grid;gap:10px;border-bottom:1px solid var(--line)}
.cart-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.cart-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 16px}
.cart-row{display:flex;gap:6px;align-items:center}
.cart-row .inp:nth-of-type(1){flex:1 1 auto;min-width:0}
.cart-row .inp:nth-of-type(2){width:72px;text-align:right}
.cart-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto;vertical-align:middle}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:64px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .tk{font-size:12.5px}
.bar-row .mono{text-align:right;color:var(--muted)}
.bar{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:0 4px 4px 0}
tr.tot-row td{border-top:1px solid var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
table.comp td{cursor:default;white-space:normal}
table.comp td.l{font-family:var(--f-body)}
table.comp tr.tot td{font-weight:600;border-top:1px solid var(--muted)}
table.comp tbody tr:hover td{background:transparent}
table.comp tbody tr.sel td{background:var(--accent-soft)}
table.comp tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.f label.check,.check{display:flex;gap:8px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" data-tab="buscador"><h1>Painel de Ações</h1><span>B3</span></div>
  <div class="search"><input id="q" placeholder="Buscar ação ou empresa (PETR4, Weg…)" autocomplete="off" aria-label="Buscar ação"><div class="sugs" id="sugs" hidden></div></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="buscador">Buscador</button>
    <button role="tab" data-tab="acao">Ação</button>
    <button role="tab" data-tab="simulador">Simulador</button>
  </nav>
  <button class="btn" data-todas="1">Todas as ações</button>
  <span class="stamp" id="stamp">carregando…</span>
</div></header>
<main id="app"><div class="empty">Carregando dados…</div></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
// ===================== estado =====================
const S = { tab:'buscador', rows:[], meta:{}, macro:null, hist:{}, tk:'', sort:{k:'valor_mercado',d:-1},
  f:{mercado:'',setor:'',tipo:'',plMin:'',plMax:'',dyMin:'',roeMin:'',dlMax:'',liqMin:'',soPreco:true,semBanco:false},
  range:'10', modo:'preco', sim:{modo:'uma',tk:'',valor:10000,inicio:'2016-01',aporte:0,reinv:true},
  cart:{itens:['ITUB4','PETR4','WEGE3','BBAS3'].map(tk=>({tk,p:''}))}, charts:{} };

// ===================== util =====================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=v=>v!=null&&isFinite(v);
const fN=(v,d=2)=>ok(v)?v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const fR=v=>ok(v)?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const fP=(v,d=1,s=false)=>ok(v)?(s&&v>0?'+':'')+(v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%':'—';
const fB=v=>{ if(!ok(v)) return '—'; const a=Math.abs(v); if(a>=1e12) return 'R$ '+fN(v/1e12,2)+' tri'; if(a>=1e9) return 'R$ '+fN(v/1e9,2)+' bi'; if(a>=1e6) return 'R$ '+fN(v/1e6,1)+' mi'; if(a>=1e3) return 'R$ '+fN(v/1e3,0)+' mil'; return fR(v); };
const fX=v=>ok(v)?fN(v,2):'—';
const cls=v=>ok(v)?(v>0?'up':v<0?'down':''):'muted';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num=s=>{ s=String(s??'').trim(); if(!s) return NaN; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s); };
const byTk=t=>S.rows.find(r=>r.ticker===t);
const marketOf=t=>/^[A-Z]{4}\d{1,2}$/.test(t)?'BR':'US';
const fU=v=>ok(v)?v.toLocaleString('pt-BR',{style:'currency',currency:'USD'}):'—';
const money=(v,cur)=>cur==='USD'?fU(v):fR(v);
const fBc=(v,cur)=>{ if(cur!=='USD') return fB(v); if(!ok(v)) return '—'; const a=Math.abs(v); if(a>=1e12) return 'US$ '+fN(v/1e12,2)+' tri'; if(a>=1e9) return 'US$ '+fN(v/1e9,2)+' bi'; if(a>=1e6) return 'US$ '+fN(v/1e6,1)+' mi'; if(a>=1e3) return 'US$ '+fN(v/1e3,0)+' mil'; return fU(v); };
const curRow=r=>(r&&r.moeda)||'BRL';

// ===================== dados =====================
async function getJSON(p){ const r=await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
// A Alpha Vantage entrega o preço de fechamento SEM ajuste de desdobramento, mas os proventos já ajustados.
// Detecta desdobramentos/grupamentos pelo salto entre o preço ajustado e o bruto e corrige o preço.
function ajustaDesdobramentos(h){
  const n=h.d.length, f=new Array(n).fill(1), cand=[2,3,4,5,8,10,20,50,100]; let cum=1; h.sp=[];
  for(let i=n-1;i>0;i--){
    f[i]=cum;
    const k=(h.a[i]/h.a[i-1])/(h.c[i]/h.c[i-1]); let s=1;
    if(k>1.45){ const m=cand.find(x=>Math.abs(k/x-1)<0.1); if(m) s=m; }
    else if(k<0.7){ const m=cand.find(x=>Math.abs(k*x-1)<0.1); if(m) s=1/m; }
    if(s!==1) h.sp.push([h.d[i],s]);
    cum*=s;
  }
  f[0]=cum; h.c=h.c.map((x,i)=>x/f[i]);
}
// A Alpha Vantage grátis aceita 1 consulta por segundo e 25 por dia: as consultas da prévia vão em fila,
// com intervalo, e o resultado fica guardado neste navegador por 12 horas para não gastar a cota de novo.
let avFila=Promise.resolve(), avUltima=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HKEY='painel-acoes-hist-';
function histCache(t,h){ try{ if(h){ localStorage.setItem(HKEY+t,JSON.stringify({at:Date.now(),h})); return; } const x=JSON.parse(localStorage.getItem(HKEY+t)||'null'); if(x&&Date.now()-x.at<12*3600e3) return x.h; }catch{} return null; }
async function avChamada(mcp,t){
  const vez=avFila.then(async()=>{ const esp=1300-(Date.now()-avUltima); if(esp>0) await sleep(esp); avUltima=Date.now();
    return mcp.callTool('Alpha Vantage MCP Server','TIME_SERIES_MONTHLY_ADJUSTED',{symbol:marketOf(t)==='US'?t:t+'.SAO',datatype:'csv'},{cache:{staleTime:300000,gcTime:86400000}}); });
  avFila=vez.catch(()=>{}); return vez;
}
async function loadHist(t){
  if(S.hist[t]) return S.hist[t];
  try{ S.hist[t]=await getJSON('data/hist/'+t+'.json'); S.hist[t].s=1; return S.hist[t]; }catch{}
  const c=histCache(t); if(c){ S.hist[t]=c; return c; }
  // prévia dentro do Claude: busca o histórico mensal pela Alpha Vantage (conector do usuário)
  try{
    const mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if(!mcp) return null;
    let p=null;
    for(let tent=0;tent<3;tent++){
      const res=await avChamada(mcp,t);
      p=res.payload; if(p&&typeof p==='object'&&typeof p.result==='string') p=p.result;
      const txt=typeof p==='string'?p:JSON.stringify(p||'');
      if(/25 requests per day|per day/i.test(txt)){ S.avErro='A Alpha Vantage grátis chegou ao limite de 25 consultas hoje. Amanhã volta; no site do GitHub esse limite não existe.'; return null; }
      if(/1 request per second|rate limit|spreading out/i.test(txt)){ await sleep(2000+tent*1500); continue; }
      break;
    }
    if(typeof p!=='string') return null;
    const lines=p.trim().split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(x=>x.length>=8).reverse();
    if(!lines.length) return null;
    const h={d:lines.map(x=>x[0].slice(0,7)),c:lines.map(x=>+x[4]),a:lines.map(x=>+x[5]),v:lines.map(x=>+x[7]),s:0,src:'Alpha Vantage'};
    ajustaDesdobramentos(h); S.hist[t]=h; histCache(t,h);
    return h;
  }catch(e){ console.warn(e); return null; }
}

// ===================== render geral =====================
function setTab(t){ S.tab=t; document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); render(); }
function render(){
  Object.values(S.charts).forEach(c=>c&&c.destroy()); S.charts={};
  const v={buscador:vBuscador,acao:vAcao,simulador:vSim}[S.tab]; $('#app').innerHTML=v(); after();
}
function after(){
  if(S.tab==='acao') drawAcao();
  if(S.tab==='simulador') runSim();
}

// ===================== buscador =====================
const COLS=[
  ['ticker','Ação','l'],['setor','Setor','l'],['preco','Preço'],['pl','P/L'],['pvp','P/VP'],['dy','DY'],['roe','ROE'],['m_liq','Marg. líq.'],
  ['div_liq_ebitda','DL/EBITDA'],['ev_ebitda','EV/EBITDA'],['var_12m','12 meses'],['liquidez','Liquidez/dia'],['valor_mercado','Valor de mercado']];
const PRESETS={
  'Graham':{plMin:'0',plMax:'15',pvpMax:1.5},
  'Dividendos':{dyMin:'6',plMin:'0'},
  'Qualidade':{roeMin:'15',dlMax:'2',plMin:'0'},
  'Limpar':{}
};
function filtered(){
  const f=S.f; let r=S.rows;
  const n=x=>num(x);
  if(f.soPreco) r=r.filter(x=>ok(x.preco));
  if(f.semBanco) r=r.filter(x=>!x.banco);
  if(f.mercado) r=r.filter(x=>(x.mercado||'Brasil')===f.mercado);
  if(f.setor) r=r.filter(x=>x.setor===f.setor);
  if(f.tipo) r=r.filter(x=>f.tipo==='ON'?/3$/.test(x.ticker):f.tipo==='PN'?/[456]$/.test(x.ticker):/11$/.test(x.ticker));
  if(isFinite(n(f.plMin))) r=r.filter(x=>ok(x.pl)&&x.pl>=n(f.plMin));
  if(isFinite(n(f.plMax))) r=r.filter(x=>ok(x.pl)&&x.pl<=n(f.plMax));
  if(f.pvpMax) r=r.filter(x=>ok(x.pvp)&&x.pvp<=f.pvpMax);
  if(isFinite(n(f.dyMin))) r=r.filter(x=>ok(x.dy??x.dy_cvm)&&(x.dy??x.dy_cvm)*100>=n(f.dyMin));
  if(isFinite(n(f.roeMin))) r=r.filter(x=>ok(x.roe)&&x.roe*100>=n(f.roeMin));
  if(isFinite(n(f.dlMax))) r=r.filter(x=>x.banco||(ok(x.div_liq_ebitda)&&x.div_liq_ebitda<=n(f.dlMax)));
  if(isFinite(n(f.liqMin))) r=r.filter(x=>ok(x.liquidez)&&x.liquidez>=n(f.liqMin)*1000);
  const {k,d}=S.sort;
  return [...r].sort((a,b)=>{ const va=a[k], vb=b[k]; if(typeof va==='string'||typeof vb==='string') return d*String(va??'').localeCompare(String(vb??''));
    if(!ok(va)) return 1; if(!ok(vb)) return -1; return d*(va-vb); });
}
function cell(r,k){
  const v=r[k];
  switch(k){
    case 'ticker': return `<td class="l"><span class="tk">${esc(v)}</span>${r.moeda==='USD'?'<span class="chip" style="margin-left:6px;padding:0 6px">EUA</span>':''}<div class="co">${esc(r.empresa)}</div></td>`;
    case 'setor': return `<td class="l"><span class="co">${esc((v||'').replace(/^Emp\. Adm\. Part\. - /,''))}</span></td>`;
    case 'preco': return `<td>${ok(v)?fN(v):'—'}</td>`;
    case 'dy': { const d=r.dy??r.dy_cvm; return `<td>${fP(d)}</td>`; }
    case 'roe': case 'm_liq': return `<td class="${cls(v)}">${fP(v)}</td>`;
    case 'var_12m': return `<td class="${cls(v)}">${fP(v,1,true)}</td>`;
    case 'liquidez': case 'valor_mercado': return `<td>${fBc(v,curRow(r))}</td>`;
    default: return `<td>${fX(v)}</td>`;
  }
}

  const ctx=$('#ch-hist'); if(!ctx||!window.Chart) return;

    const x0=x.getPixelForValue(Math.min(sel.a,sel.b)), x1=x.getPixelForValue(Math.max(sel.a,sel.b));
    c.save(); c.fillStyle=css('--accent-soft'); c.fillRect(x0,a.top,x1-x0,a.bottom-a.top); c.strokeStyle=css('--accent'); c.setLineDash([4,3]); c.beginPath(); c.moveTo(x0,a.top); c.lineTo(x0,a.bottom); c.moveTo(x1,a.top); c.lineTo(x1,a.bottom); c.stroke(); c.restore(); }};

    const i=from+Math.min(sel.a,sel.b), j=from+Math.max(sel.a,sel.b);
    const pv=h.c[j]/h.c[i]-1, tv=h.a[j]/h.a[i]-1; let dv=0; for(let k=i+1;k<=j;k++) dv+=h.v[k]||0;
    const meses=j-i, anos=meses/12, aa=anos>=1?Math.pow(h.a[j]/h.a[i],1/anos)-1:null, br=d=>d.split('-').reverse().join('/');

const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MAX_CART=10;
function anosSim(){ const y=new Date().getFullYear(); const a=[]; for(let i=y;i>=1995;i--) a.push(String(i)); return a; }
const moedaTk=t=>(byTk(t)&&byTk(t).moeda)||(marketOf(t)==='US'?'USD':'BRL');
const brMes=d=>{ const [y,m]=d.split('-'); return MESES[+m-1]+'/'+y; };
function mesesEntre(a,b){ const out=[]; let [y,m]=a.split('-').map(Number); const [y2,m2]=b.split('-').map(Number); while(y<y2||(y===y2&&m<=m2)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} } return out; }
function fxMap(){ const u=S.macro&&S.macro.usdbrl; return u&&Object.keys(u).length?u:null; }
function fxFn(t){ if(moedaTk(t)!=='USD') return null; const u=fxMap(); if(!u) return null; let last=null; return d=>{ if(u[d]!=null) last=u[d]; return last; }; }

// Mês a mês: a posição acompanha o preço (ajustado por desdobramentos); os proventos do mês caem em dinheiro
// e, se marcado, compram mais ações no fechamento daquele mês. Valores em reais (ações dos EUA convertidas pelo dólar do mês).
function simPath(h, labels, valor, aporte, reinv, semDiv, fx){
  if(!h._ix) h._ix=Object.fromEntries(h.d.map((d,i)=>[d,i]));
  const out=[], inv=[]; let acoes=0, cash=0, divs=0, invested=0, prev=null;
  labels.forEach((lb,k)=>{
    let i=h._ix[lb]; if(i==null) i=prev;
    const f=fx?(fx(lb)||1):1;
    if(k===0){ acoes=valor/f; invested=valor; }
    else{
      if(i!==prev&&prev!=null){
        acoes*=h.c[i]/h.c[prev];
        const d=semDiv?0:acoes*(h.v[i]||0)/h.c[i]; divs+=d*f;
        if(reinv) acoes+=d; else cash+=d*f;
      }
      if(aporte){ acoes+=aporte/f; invested+=aporte; }
    }
    prev=i; out.push(acoes*f+cash); inv.push(invested);
  });
  return {out,inv,divs,invested};
}
function simBench(labels, valor, aporte, kind){
  const m=S.macro; if(!m) return null; const out=[]; let v=valor;
  if(kind==='cdi'||kind==='ipca'){ const s=m[kind]; if(!s) return null; for(let i=0;i<labels.length;i++){ if(i>0){ const r=s[labels[i]]; if(r==null) return null; v=v*(1+r/100)+aporte; } out.push(v);} return out; }
  if(kind==='ibov'){ const s=m.ibov; if(!s) return null; let q=valor/(s[labels[0]]||NaN); if(!isFinite(q)) return null; for(let i=0;i<labels.length;i++){ const p=s[labels[i]]; if(p==null) return null; if(i>0&&aporte) q+=aporte/p; out.push(q*p);} return out; }
}

function readSimNoRender(){
  const s=S.sim, g=id=>document.getElementById(id);
  if(g('s-val')){ s.valor=num(g('s-val').value)||0; s.aporte=num(g('s-ap').value)||0; s.reinv=g('s-re').checked; s.inicio=g('s-ano').value+'-'+g('s-mes').value; }
  if(g('s-tk')) s.tk=g('s-tk').value.trim().toUpperCase();
  if(s.modo==='carteira') S.cart.itens=S.cart.itens.map((x,i)=>({tk:(g('c-tk-'+i)?g('c-tk-'+i).value:x.tk).trim().toUpperCase(),p:g('c-p-'+i)?g('c-p-'+i).value.trim():x.p}));
}
function readSim(){ readSimNoRender(); render(); }
function pesos(){
  const it=S.cart.itens.filter(x=>x.tk); const raw=it.map(x=>num(x.p));
  const temAlgum=raw.some(v=>isFinite(v)&&v>0);
  let w=temAlgum? raw.map(v=>isFinite(v)&&v>0?v:0) : it.map(()=>1);
  const soma=w.reduce((a,b)=>a+b,0)||1;
  return {it, w:w.map(v=>v/soma), somaDigitada: temAlgum? raw.reduce((a,v)=>a+(isFinite(v)?v:0),0):null};
}
function blocoComposicao(labels, cur, inv, vPreco, vDiv, vSem, vRe, reinv, sps){
  const fM=v=>money(v,cur); const pc=x=>`<span class="muted">${fP(x/inv,1,true)}</span>`;
  const spTxt=sps.map(([t,d,f])=>f>=1?`<li><b>${esc(t)}: desdobramento de 1 para ${fN(f,0)}</b> em ${brMes(d)}. Cada ação virou ${fN(f,0)} e o preço foi dividido por ${fN(f,0)}.</li>`:`<li><b>${esc(t)}: grupamento de ${fN(1/f,0)} para 1</b> em ${brMes(d)}. Cada ${fN(1/f,0)} ações viraram 1.</li>`).join('');
  return `<section class="card"><div class="card-h"><h2>De onde veio o resultado</h2><span class="note">${brMes(labels[0])} a ${brMes(labels.at(-1))}</span></div>
    <div class="tbl-wrap"><table class="comp"><tbody>
     <tr><td class="l">Valor investido</td><td>${fM(inv)}</td><td></td></tr>
     <tr><td class="l">+ Valorização das ações <span class="muted">(só o preço, como no Google)</span></td><td class="${cls(vPreco)}">${fM(vPreco)}</td><td>${pc(vPreco)}</td></tr>
     <tr><td class="l">+ Dividendos e JCP recebidos em dinheiro</td><td class="${cls(vDiv)}">${fM(vDiv)}</td><td>${pc(vDiv)}</td></tr>
     <tr class="tot ${reinv?'':'sel'}"><td class="l">= Sem reinvestir os dividendos</td><td>${fM(vSem)}</td><td>${pc(vSem-inv)}</td></tr>
     <tr><td class="l">+ Ganho extra por reinvestir <span class="muted">(dividendos comprando mais ações)</span></td><td class="${cls(vRe-vSem)}">${fM(vRe-vSem)}</td><td>${pc(vRe-vSem)}</td></tr>
     <tr class="tot ${reinv?'sel':''}"><td class="l">= Reinvestindo os dividendos</td><td>${fM(vRe)}</td><td>${pc(vRe-inv)}</td></tr>
    </tbody></table></div>
    <div class="card-b" style="padding-top:8px">${sps.length?`<p class="note" style="margin:0 0 4px"><b style="color:var(--fg)">Desdobramentos no período</b></p><ul class="note" style="margin:0;padding-left:18px">${spTxt}</ul><p class="note" style="margin:6px 0 0">Desdobramento não muda o patrimônio nem o total de dividendos: você passa a ter mais ações, cada uma valendo e pagando proporcionalmente menos. A conta acima já considera isso.</p>`:'<p class="note" style="margin:0">Nenhum desdobramento ou grupamento no período.</p>'}</div>
   </section>`;
}
function kpisBloco(fim, inv, labels, s, cur){
  const lucro=fim-inv, anos=(labels.length-1)/12, tir=anos>0&&!s.aporte?Math.pow(fim/s.valor,1/anos)-1:null;
  const cdi=cur==='BRL'?simBench(labels,s.valor,s.aporte,'cdi'):null, ipca=cur==='BRL'?simBench(labels,s.valor,s.aporte,'ipca'):null;
  return {html:`<section class="kpis">
    <div class="kpi"><span class="lab">Você teria hoje</span><span class="val">${money(fim,cur)}</span><span class="sub ${cls(lucro)}">${fP(fim/inv-1,1,true)} · ${s.reinv?'reinvestindo':'sem reinvestir'}</span></div>
    <div class="kpi"><span class="lab">Total investido</span><span class="val">${money(inv,cur)}</span><span class="sub muted">${labels.length-1} meses</span></div>
    <div class="kpi"><span class="lab">Ganho</span><span class="val ${cls(lucro)}">${money(lucro,cur)}</span><span class="sub muted">${ok(tir)?fP(tir,1)+' ao ano':''}</span></div>
    ${cdi?`<div class="kpi"><span class="lab">No CDI teria</span><span class="val">${fR(cdi.at(-1))}</span><span class="sub ${cls(fim-cdi.at(-1))}">${fim>=cdi.at(-1)?'ganhou':'perdeu'} do CDI por ${fR(Math.abs(fim-cdi.at(-1)))}</span></div>`:''}
    ${ipca?`<div class="kpi"><span class="lab">Só para empatar com a inflação</span><span class="val">${fR(ipca.at(-1))}</span><span class="sub muted">valor corrigido pelo IPCA</span></div>`:''}
   </section>`, cdi};
}
const errBox=m=>`<div class="card"><div class="empty">${m}</div></div>`;

async function runSim(){ S.avErro=null; return S.sim.modo==='carteira' ? runCart() : runUma(); }

async function runUma(){
  const s=S.sim; const box=$('#sim-out'); if(!box) return;
  const h=await loadHist(s.tk); if(S.tab!=='simulador'||S.sim.modo!=='uma') return;

  const ini=s.inicio>h.d[0]?s.inicio:h.d[0];
  const labels=h.d.filter(d=>d>=ini); if(labels.length<2){ box.innerHTML=errBox('Data inicial depois do último mês disponível.'); return; }
  let fx=fxFn(s.tk), cur=moedaTk(s.tk)==='USD'&&!fx?'USD':'BRL';
  const rP=simPath(h,labels,s.valor,s.aporte,false,true,fx), rC=simPath(h,labels,s.valor,s.aporte,false,false,fx), rR=simPath(h,labels,s.valor,s.aporte,true,false,fx);
  const r=s.reinv?rR:rC, fim=r.out.at(-1), inv=r.invested;
  const sps=(h.sp||[]).filter(([d])=>d>labels[0]&&d<=labels.at(-1)).map(([d,f])=>[s.tk,d,f]);
  const k=kpisBloco(fim,inv,labels,s,cur), ibov=cur==='BRL'?simBench(labels,s.valor,s.aporte,'ibov'):null;
  const nota=[ini!==s.inicio?`O histórico de ${esc(s.tk)} começa em ${brMes(h.d[0])}; a simulação parte daí.`:'', moedaTk(s.tk)==='USD'?(fx?'Ação dos EUA: os valores estão em reais, convertidos pelo dólar de cada mês (inclui a variação do câmbio).':'Ação dos EUA: valores em dólar. A conversão para reais usa o câmbio histórico que vem com a atualização automática.'):''].filter(Boolean).map(x=>`<p class="note" style="margin:8px 0 0">${x}</p>`).join('');
  box.innerHTML=`<div style="display:grid;gap:18px">${k.html}${blocoComposicao(labels,cur,inv,rP.out.at(-1)-inv,rC.divs,rC.out.at(-1),rR.out.at(-1),s.reinv,sps)}
   <section class="card"><div class="card-h"><h2>Evolução do patrimônio</h2><div class="legend"><span><i style="background:var(--s1)"></i>${esc(s.tk)}</span>${k.cdi?'<span><i style="background:var(--s2)"></i>CDI</span>':''}${ibov?'<span><i style="background:var(--s3)"></i>Ibovespa</span>':''}<span><i style="background:var(--s4)"></i>Investido</span></div></div>
    <div class="card-b"><div class="chart-box"><canvas id="ch-sim" aria-label="Gráfico da evolução do patrimônio simulado"></canvas></div>${nota}
    <p class="note" style="margin:10px 0 0">${s.reinv?'Os proventos de cada mês compram mais ações no preço de fechamento daquele mês, com frações de ação.':'Os proventos ficam parados em dinheiro, sem render juros.'} Sem imposto e sem custos de corretagem. Rentabilidade passada não garante rentabilidade futura.</p></div></section></div>`;
  const ds=[{label:s.tk,data:r.out,borderColor:css('--s1'),borderWidth:2,pointRadius:0,tension:.1}];
  if(k.cdi) ds.push({label:'CDI',data:k.cdi,borderColor:css('--s2'),borderWidth:2,pointRadius:0,tension:.1});
  if(ibov) ds.push({label:'Ibovespa',data:ibov,borderColor:css('--s3'),borderWidth:2,pointRadius:0,tension:.1});

  const o=chartOpts(v=>fBc(v,cur)); o.plugins.tooltip.callbacks.label=c=>c.dataset.label+': '+money(c.parsed.y,cur);
  if(window.Chart) S.charts.s=new Chart($('#ch-sim'),{type:'line',data:{labels,datasets:ds},options:o});

  if(!it.length){ box.innerHTML=errBox('Inclua pelo menos uma ação.'); return; }
  const dup=it.map(x=>x.tk).filter((t,i,a)=>a.indexOf(t)!==i); if(dup.length){ box.innerHTML=errBox('A ação '+esc(dup[0])+' está repetida.'); return; }

    return {tk:x.tk,w:w[i],P:simPath(hs[i],labels,v,ap,false,true,fx),C:simPath(hs[i],labels,v,ap,false,false,fx),R:simPath(hs[i],labels,v,ap,true,false,fx)}; });
  const sum=(k)=>labels.map((_,j)=>sims.reduce((a,x)=>a+x[k].out[j],0));
  const tot=sum(s.reinv?'R':'C'), invA=labels.map((_,j)=>sims.reduce((a,x)=>a+x.C.inv[j],0));

  const sps=[]; it.forEach((x,i)=>(hs[i].sp||[]).forEach(([d,f])=>{ if(d>labels[0]&&d<=labels.at(-1)) sps.push([x.tk,d,f]); })); sps.sort((a,b)=>a[1].localeCompare(b[1]));
  const k=kpisBloco(fimV,inv,labels,s,cur);
  const linhas=sims.map((x,i)=>{ const r=s.reinv?x.R:x.C, v=r.out.at(-1), iv=r.invested; return {i,tk:x.tk,w:x.w,iv,v,ret:v/iv-1,divs:x.C.divs,peso:v/fimV}; });
  const maxPeso=Math.max(...linhas.map(l=>l.peso));
  const notas=[ini!==s.inicio?`A simulação começa em ${brMes(ini)}, primeiro mês em que todas as ações da carteira têm histórico.`:'', temUS&&cur==='BRL'?'Ações dos EUA convertidas para reais pelo dólar de cada mês.':'', cur==='USD'?'Carteira só com ações dos EUA: valores em dólar.':''].filter(Boolean).map(x=>`<p class="note" style="margin:8px 0 0">${x}</p>`).join('');
  box.innerHTML=`<div style="display:grid;gap:18px">${k.html}
   <div class="two">

     <div class="card-b"><div class="chart-box"><canvas id="ch-cart" aria-label="Evolução da carteira por ação"></canvas></div>
     <div class="legend" style="margin-top:10px">${linhas.map(l=>`<span><i style="background:var(--c${l.i+1})"></i>${esc(l.tk)}</span>`).join('')}<span><i style="background:var(--fg)"></i>Investido</span>${k.cdi?'<span><i style="background:var(--s2)"></i>CDI</span>':''}</div>${notas}</div></section>

     <p class="note" style="margin:6px 0 0">Começou com ${linhas.map(l=>esc(l.tk)+' '+fP(l.w,0)).join(', ')}. Sem rebalanceamento: quem subiu mais passa a pesar mais.</p></div></section>

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-smodo],[data-add],[data-rm],[data-iguais],[data-ha],[data-todas],[data-tab],[data-open],[data-sort],[data-preset],[data-range],[data-modo],[data-simular],[data-act]');
  if(!b){ if(!e.target.closest('.search')) $('#sugs').hidden=true; return; }
  const d=b.dataset;
  if(d.ha){ readSimNoRender(); const t=new Date(); t.setMonth(t.getMonth()-12*(+d.ha)); S.sim.inicio=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'); render(); return; }
  if(d.smodo){ readSimNoRender(); S.sim.modo=d.smodo; render(); return; }
  if(d.add){ readSimNoRender(); if(S.cart.itens.length<MAX_CART) S.cart.itens.push({tk:'',p:''}); render(); setTimeout(()=>{ const el=document.getElementById('c-tk-'+(S.cart.itens.length-1)); if(el) el.focus(); }); return; }
  if(d.rm!=null){ readSimNoRender(); S.cart.itens.splice(+d.rm,1); render(); return; }
  if(d.iguais){ readSimNoRender(); S.cart.itens.forEach(x=>x.p=''); render(); return; }
  if(d.todas){ S.f={mercado:'',setor:'',tipo:'',plMin:'',plMax:'',dyMin:'',roeMin:'',dlMax:'',liqMin:'',soPreco:false,semBanco:false}; S.sort={k:'ticker',d:1}; setTab('buscador'); }
  else if(d.tab){ e.preventDefault(); setTab(d.tab); }
  else if(d.open) openTk(d.open);
  else if(d.sort){ S.sort = S.sort.k===d.sort ? {k:d.sort,d:-S.sort.d} : {k:d.sort,d:['ticker','setor'].includes(d.sort)?1:-1}; render(); }
  else if(d.preset){ const p=PRESETS[d.preset]; S.f={mercado:S.f.mercado||'',setor:'',tipo:'',plMin:'',plMax:'',dyMin:'',roeMin:'',dlMax:'',liqMin:'',soPreco:S.f.soPreco,semBanco:false,pvpMax:null,...p}; render(); }
  else if(d.range){ S.range=d.range; render(); }
  else if(d.modo){ S.modo=d.modo; render(); }

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f){ S.f[el.dataset.f]= el.type==='checkbox'?el.checked:el.value; render(); }
  if(['s-tk','s-mes','s-ano','s-re'].includes(el.id)||/^c-(tk|p)-/.test(el.id)) readSim();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='q'){
    const btns=[...document.querySelectorAll('#sugs button')];
    if(e.key==='ArrowDown'){ sugIdx=Math.min(sugIdx+1,btns.length-1); sugs(e.target.value); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sugIdx=Math.max(sugIdx-1,0); sugs(e.target.value); e.preventDefault(); }
    else if(e.key==='Enter'){ const t=(btns[sugIdx]||btns[0]); if(t) openTk(t.dataset.open); }
    else if(e.key==='Escape') $('#sugs').hidden=true;
  }
  if(e.key==='Enter'&&e.target.closest('.filters')) e.target.blur();
  if(e.key==='Enter'&&e.target.closest('.sim-form')) readSim();
});
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').slice(1).toUpperCase(); if(h&&byTk(h)&&h!==S.tk){ S.tk=h; setTab('acao'); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ sugIdx=-1; sugs(e.target.value); } });

// ===================== início =====================
(async function(){
  try{
    const [rows,meta]=await Promise.all([getJSON('data/indicadores.json'),getJSON('data/meta.json').catch(()=>({}))]);
    S.rows=rows; S.meta=meta;
    if(!rows.some(r=>ok(r.preco))) S.f.soPreco=false;
    if((meta.com_preco||0)<50) S.f.soPreco=false;
    $('#stamp').textContent=meta.atualizado_em?`Atualizado em ${meta.atualizado_em.split(' ')[0].split('-').reverse().join('/')} · ${meta.acoes} ações`:'';
  }catch(e){ $('#app').innerHTML='<div class="card"><div class="empty">Não consegui carregar os dados ('+esc(e.message)+').</div></div>'; return; }
  getJSON('data/macro.json').then(m=>{ S.macro=m; if(S.tab==='simulador') render(); }).catch(()=>{});
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h && byTk(h)){ S.tk=h; setTab('acao'); } else setTab('buscador');
})();
</script>
</body>
