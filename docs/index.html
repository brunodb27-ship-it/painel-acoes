<meta name="description" content="Indicadores fundamentalistas de todas as ações da B3, histórico de 20 anos e simulador de investimento com dividendos reinvestidos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Paleta: base grafite quase preta (estilo TradeMap), laranja como cor de ação e um degradê laranja→roxo→azul (estilo Gemini) só na marca, na aba ativa e no fio do topo.
   Layout: barra fixa com marca, busca e abas; abaixo, uma "mesa" por aba (buscador, ficha, simulador). Números em mono tabular. */
:root{
  --bg:#0a0c11; --panel:#11141b; --panel2:#181c25; --line:#232937; --fg:#eceef4; --muted:#8b93a7; --faint:#5c6478;
  --accent:#ff7a1f; --accent2:#9b7bff; --accent3:#4f8dff; --accent-ink:#1a0c02; --accent-soft:rgba(255,122,31,.13); --accent2-soft:rgba(155,123,255,.14);
  --grad:linear-gradient(90deg,#ff7a1f 0%,#e2557a 45%,#9b7bff 75%,#4f8dff 100%);
  --fib-chave:#F0B429;--fib-ext:#39C2D7;--fib-nivel:#AAB6B0;
  --up:#2fd08a; --down:#ff5d6c; --up-soft:rgba(47,208,138,.13); --down-soft:rgba(255,93,108,.13);
  --s1:#ff7a1f; --s2:#9b7bff; --s3:#4f8dff; --s4:#8b93a7;
  --c1:#ff7a1f; --c2:#9b7bff; --c3:#4f8dff; --c4:#2fd08a; --c5:#ffb347; --c6:#3fd0d4; --c7:#ff6fb1; --c8:#b5d65a; --c9:#d2a679; --c10:#c7b8ff;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f5f8; --panel:#ffffff; --panel2:#f0f0f5; --line:#dfe0ea; --fg:#13151c; --muted:#5b6072; --faint:#8b90a2;
  --accent:#d9530a; --accent2:#6a4fd6; --accent3:#2f6fe0; --accent-ink:#fff; --accent-soft:rgba(217,83,10,.09); --accent2-soft:rgba(106,79,214,.09);
  --grad:linear-gradient(90deg,#e8650f 0%,#cc3f6a 45%,#6a4fd6 75%,#2f6fe0 100%);
  --fib-chave:#c28a00;--fib-ext:#1a8fa3;--fib-nivel:#8a949c;
  --up:#0b8a55; --down:#d0303f; --up-soft:rgba(11,138,85,.09); --down-soft:rgba(208,48,63,.09);
  --s1:#d9530a; --s2:#6a4fd6; --s3:#2f6fe0; --s4:#6b7184;
  --c1:#d9530a; --c2:#6a4fd6; --c3:#2f6fe0; --c4:#0b8a55; --c5:#c98a12; --c6:#11878c; --c7:#c23a84; --c8:#6b8a1e; --c9:#8f6a3f; --c10:#4b55c9; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5f5f8; --panel:#ffffff; --panel2:#f0f0f5; --line:#dfe0ea; --fg:#13151c; --muted:#5b6072; --faint:#8b90a2;
  --accent:#d9530a; --accent2:#6a4fd6; --accent3:#2f6fe0; --accent-ink:#fff; --accent-soft:rgba(217,83,10,.09); --accent2-soft:rgba(106,79,214,.09);
  --grad:linear-gradient(90deg,#e8650f 0%,#cc3f6a 45%,#6a4fd6 75%,#2f6fe0 100%);
  --fib-chave:#c28a00;--fib-ext:#1a8fa3;--fib-nivel:#8a949c;
  --up:#0b8a55; --down:#d0303f; --up-soft:rgba(11,138,85,.09); --down-soft:rgba(208,48,63,.09);
  --s1:#d9530a; --s2:#6a4fd6; --s3:#2f6fe0; --s4:#6b7184;
  --c1:#d9530a; --c2:#6a4fd6; --c3:#2f6fe0; --c4:#0b8a55; --c5:#c98a12; --c6:#11878c; --c7:#c23a84; --c8:#6b8a1e; --c9:#8f6a3f; --c10:#4b55c9; color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);opacity:.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:1480px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{display:block;height:92px;width:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.25)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:600px){.brand .logo{height:64px}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;letter-spacing:.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--accent2);letter-spacing:.08em;border:1px solid var(--accent2-soft);background:var(--accent2-soft);padding:1px 6px;border-radius:4px}
.search{position:relative;flex:1 1 220px;max-width:380px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.search input:focus{border-color:var(--accent);outline:none}
.sugs{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;z-index:9}
.sugs button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugs button:hover,.sugs button.on{background:var(--panel2)}
.sugs b{font-family:var(--f-display);min-width:64px}
nav.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
nav.tabs button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--fg);position:relative}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:var(--grad)}
.stamp{margin-left:auto;font-size:12px;color:var(--muted)}
.btn.tema{padding:6px 10px;font-size:12.5px;gap:6px}
.rf-form{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important}
.rf-form .pair select{flex:0 0 auto;width:auto;min-width:96px}
.btn.tema svg{width:15px;height:15px}

main{max-width:1480px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:0}
.card-b{padding:14px 16px}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--accent-soft);border:1px dashed var(--accent);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}

/* filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.f{display:grid;gap:4px}
.f label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f .pair{display:flex;gap:6px}
.f .pair input{width:100%}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.sorted{color:var(--accent)}
td{padding:7px 7px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--panel2)}
.tk{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.co{font-family:var(--f-body);color:var(--muted);font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.co.set{display:inline-block;max-width:130px;white-space:nowrap;vertical-align:bottom}
.rk-n{color:var(--muted);font-size:12px;width:28px}
td.hl{color:var(--accent);font-weight:600}
th.hl{color:var(--accent)}
.tbl-scroll{max-height:68vh;overflow:auto}

/* ficha */
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.hero .name{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1}
.hero .sub{color:var(--muted);margin-top:6px}
.hero .px{font-family:var(--f-mono);font-size:30px;font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.grp h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 6px;font-weight:600}
.ind{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ind:last-child{border-bottom:0}
.ind .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ind .ref{display:block;font-size:10.5px;color:var(--muted);text-align:right;font-family:var(--f-body)}
.ind .ref.bom{color:var(--up)} .ind .ref.ruim{color:var(--down)}
.fibrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:12px 0 0}
.fibrow .fld{display:grid;gap:3px}
.fibrow .fld b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fibrow input[type=number]{width:110px}
.btn.armed{border-color:var(--fib-chave);color:var(--fib-chave);background:var(--accent-soft)}
.fibopts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--muted)}
.fibopts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.fibwrap{display:grid;grid-template-columns:1fr 230px;gap:14px;align-items:start;margin-top:10px}
@media(max-width:760px){.fibwrap{grid-template-columns:1fr}}
.fibtbl td,.fibtbl th{padding:5px 8px}
.fibtbl tr.lv0 td,.fibtbl tr.lv100 td{color:var(--fib-chave);font-weight:600}
.fibtbl tr.lvx td{color:var(--fib-ext)}
.fibtbl tr.perto td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.ind span[title]{cursor:help;text-decoration:underline dotted var(--faint);text-underline-offset:3px}
.chart-box{position:relative;height:320px}
#ch-hist{touch-action:none;cursor:crosshair}
.selbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:13px;min-height:44px}
.selbox .it{display:grid;gap:1px}
.selbox .it small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.selbox .it b{font-family:var(--f-mono);font-weight:600}
.selbox .x{margin-left:auto}
.seg{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:5px;color:var(--muted);cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* simulador */
.sim-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.sim-form .inp{width:100%}
.sim-form .pair{display:flex;gap:6px}
.sim-form .pair select:first-child{flex:0 0 76px}
.quick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick .btn{padding:3px 8px;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:3px;min-width:0}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--f-mono);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-family:var(--f-mono);font-size:12px}
.cart{display:grid;gap:10px;border-bottom:1px solid var(--line)}
.cart-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.cart-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 16px}
.cart-row{display:flex;gap:6px;align-items:center}
.cart-row .inp:nth-of-type(1){flex:1 1 auto;min-width:0}
.cart-row .inp:nth-of-type(2){width:72px;text-align:right}
.cart-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto;vertical-align:middle}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:64px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .tk{font-size:12.5px}
.bar-row .mono{text-align:right;color:var(--muted)}
.bar{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:0 4px 4px 0}
tr.tot-row td{border-top:1px solid var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
table.comp td{cursor:default;white-space:normal}
table.comp td.l{font-family:var(--f-body)}
table.comp tr.tot td{font-weight:600;border-top:1px solid var(--muted)}
table.comp tbody tr:hover td{background:transparent}
table.comp tbody tr.sel td{background:var(--accent-soft)}
table.comp tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.f label.check,.check{display:flex;gap:8px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)}
</style>
</head>

const fBc=(v,cur)=>{ if(cur!=='USD') return fB(v); if(!ok(v)) return '—'; const a=Math.abs(v); if(a>=1e12) return 'US$ '+fN(v/1e12,2)+' tri'; if(a>=1e9) return 'US$ '+fN(v/1e9,2)+' bi'; if(a>=1e6) return 'US$ '+fN(v/1e6,1)+' mi'; if(a>=1e3) return 'US$ '+fN(v/1e3,0)+' mil'; return fU(v); };

// DY: o dos dividendos pagos (Yahoo); se faltar ou vier muito abaixo do declarado à CVM (buraco no histórico do Yahoo), usa o da CVM
const dyDe=r=>{ const y=ok(r.dy)?r.dy:null, c=ok(r.dy_cvm)?r.dy_cvm:null; if(c!=null&&(r.mercado||'Brasil')==='Brasil'&&(y==null||y<c*0.3)) return c; return y??c; };

async function getJSON(p){ const r=await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
// A Alpha Vantage entrega o preço de fechamento SEM ajuste de desdobramento, mas os proventos já ajustados.
// Detecta desdobramentos/grupamentos pelo salto entre o preço ajustado e o bruto e corrige o preço.
function ajustaDesdobramentos(h){
  const n=h.d.length, f=new Array(n).fill(1), cand=[2,3,4,5,8,10,20,50,100]; let cum=1; h.sp=[];
  for(let i=n-1;i>0;i--){
    f[i]=cum;
    const k=(h.a[i]/h.a[i-1])/(h.c[i]/h.c[i-1]); let s=1;
    if(k>1.45){ const m=cand.find(x=>Math.abs(k/x-1)<0.1); if(m) s=m; }
    else if(k<0.7){ const m=cand.find(x=>Math.abs(k*x-1)<0.1); if(m) s=1/m; }
    if(s!==1) h.sp.push([h.d[i],s]);
    cum*=s;
  }
  f[0]=cum; h.c=h.c.map((x,i)=>x/f[i]);
}
// A Alpha Vantage grátis aceita 1 consulta por segundo e 25 por dia: as consultas da prévia vão em fila,
// com intervalo, e o resultado fica guardado neste navegador por 12 horas para não gastar a cota de novo.
let avFila=Promise.resolve(), avUltima=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HKEY='painel-acoes-hist-';
function histCache(t,h){ try{ if(h){ localStorage.setItem(HKEY+t,JSON.stringify({at:Date.now(),h})); return; } const x=JSON.parse(localStorage.getItem(HKEY+t)||'null'); if(x&&Date.now()-x.at<12*3600e3) return x.h; }catch{} return null; }
async function avChamada(mcp,t){
  const vez=avFila.then(async()=>{ const esp=1300-(Date.now()-avUltima); if(esp>0) await sleep(esp); avUltima=Date.now();
    return mcp.callTool('Alpha Vantage MCP Server','TIME_SERIES_MONTHLY_ADJUSTED',{symbol:marketOf(t)==='US'?t:t+'.SAO',datatype:'csv'},{cache:{staleTime:300000,gcTime:86400000}}); });
  avFila=vez.catch(()=>{}); return vez;
}
async function loadHist(t){
  if(S.hist[t]) return S.hist[t];
  try{ S.hist[t]=await getJSON('data/hist/'+t+'.json'); S.hist[t].s=1; return S.hist[t]; }catch{}
  const c=histCache(t); if(c){ S.hist[t]=c; return c; }
  // prévia dentro do Claude: busca o histórico mensal pela Alpha Vantage (conector do usuário)
  try{
    const mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if(!mcp) return null;
    let p=null;
    for(let tent=0;tent<3;tent++){
      const res=await avChamada(mcp,t);
      p=res.payload; if(p&&typeof p==='object'&&typeof p.result==='string') p=p.result;
      const txt=typeof p==='string'?p:JSON.stringify(p||'');
      if(/25 requests per day|per day/i.test(txt)){ S.avErro='A Alpha Vantage grátis chegou ao limite de 25 consultas hoje. Amanhã volta; no site do GitHub esse limite não existe.'; return null; }
      if(/1 request per second|rate limit|spreading out/i.test(txt)){ await sleep(2000+tent*1500); continue; }
      break;
    }
    if(typeof p!=='string') return null;
    const lines=p.trim().split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(x=>x.length>=8).reverse();
    if(!lines.length) return null;
    const h={d:lines.map(x=>x[0].slice(0,7)),c:lines.map(x=>+x[4]),a:lines.map(x=>+x[5]),v:lines.map(x=>+x[7]),s:0,src:'Alpha Vantage'};
    ajustaDesdobramentos(h); S.hist[t]=h; histCache(t,h);
    return h;
  }catch(e){ console.warn(e); return null; }
}

  if(isFinite(n(f.plMin))) r=r.filter(x=>ok(x.pl)&&x.pl>=n(f.plMin));
  if(isFinite(n(f.plMax))) r=r.filter(x=>ok(x.pl)&&x.pl<=n(f.plMax));
  if(f.pvpMax) r=r.filter(x=>ok(x.pvp)&&x.pvp<=f.pvpMax);

];

function rkCompleto(m,k,n){
  if(RK_PRECO.includes(k)) return !!m.preco_completo;
  if(RK_DIV.includes(k)) return (m.anos_div_base||0)>=n;
  return (m.anos_balanco||0)>=n;
}
function rkFmt(v,k,n){
  if(!ok(v)) return '—';
  if(k==='anos_div'||k==='anos_lucro') return v+' de '+n;
  return fP(v,1,['ret_total','ret_preco','cagr_total','cagr_receita','cagr_lucro'].includes(k));
}
function rkLista(){
  const R=S.rank, q=S.rk, n=+q.n, k=q.crit; if(!R) return [];
  let out=[];
  for(const r of S.rows){
    const m=(R.dados[r.ticker]||{})[q.n]; if(!m||!ok(m[k])) continue;
    if(q.mercado&&(r.mercado||'Brasil')!==q.mercado) continue;
    if(q.setor&&r.setor!==q.setor) continue;
    if(isFinite(num(q.liq))&&!(ok(r.liquidez)&&r.liquidez>=num(q.liq)*1000)) continue;
    if(q.completo&&!rkCompleto(m,k,n)) continue;
    if(['m_ebit_med','m_liq_med','roe_med','cagr_receita','cagr_lucro','anos_lucro'].includes(k)&&r.setor==='ETF') continue;
    out.push({r,m});
  }
  const d=q.asc?1:-1;
  out.sort((a,b)=>d*(a.m[k]-b.m[k])||((b.m.ret_total??-9)-(a.m.ret_total??-9)));
  return out;
}

// ---- referência do setor: mediana dos pares
const MENOR_MELHOR=['pl','pvp','psr','ev_ebitda','ev_ebit','div_liq_ebitda','div_liq_pl'];
const MAIOR_MELHOR=['roe','m_bruta','m_ebit','m_liq','dy','liq_corrente'];
const _med={};
function mediana(xs){ if(!xs.length) return null; const a=[...xs].sort((x,y)=>x-y), m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function valorInd(x,k){ return k==='dy'?dyDe(x):x[k]; }
function valido(k,v){ if(!ok(v)) return false;
  if(['pl','pvp','psr','ev_ebitda','ev_ebit'].includes(k)) return v>0&&v<200;   // negativos (prejuízo) e extremos distorcem a mediana
  if(['m_bruta','m_ebit','m_liq'].includes(k)) return v>-1&&v<=1;
  if(k==='dy') return v>=0&&v<0.6;
  return Math.abs(v)<1e3; }
function refGrupo(r,k){
  const merc=r.mercado||'Brasil', chave=merc+'|'+(r.setor||'')+'|'+k+'|'+(r.banco?1:0);
  if(chave in _med) return _med[chave];
  const pares=S.rows.filter(x=>(x.mercado||'Brasil')===merc&&!/^(ETF|Índice)$/.test(x.setor||''));
  const porEmp=xs=>{ const vistos=new Set(), out=[]; for(const x of xs){ const id=x.empresa||x.ticker; if(vistos.has(id)) continue; const v=valorInd(x,k); if(valido(k,v)){ vistos.add(id); out.push(v);} } return out; };
  let vals=porEmp(pares.filter(x=>x.setor===r.setor&&!!x.banco===!!r.banco)), nome='setor';
  if(vals.length<4){ vals=porEmp(pares.filter(x=>!!x.banco===!!r.banco)); nome=merc==='EUA'?'mercado EUA':'mercado'; }
  return _med[chave]= vals.length>=4?{m:mediana(vals),n:vals.length,nome}:null;
}
function refSetor(r,k,v,t){
  if(!MENOR_MELHOR.includes(k)&&!MAIOR_MELHOR.includes(k)) return '';
  if(/^(ETF|Índice)$/.test(r.setor||'')) return '';
  const g=refGrupo(r,k); if(!g) return '';
  let tom='';
  if(valido(k,v)){ const melhor=MENOR_MELHOR.includes(k)?v<g.m:v>g.m; tom=melhor?'bom':'ruim'; }
  else if(ok(v)&&['pl','ev_ebitda','ev_ebit'].includes(k)&&v<=0) tom='ruim';
  return `<span class="ref ${tom}" title="Mediana de ${g.n} empresas do ${g.nome}">${g.nome}: ${fmt(g.m,t,curRow(r))}</span>`;
}

const FIB_DICA='Clique em Marcar e depois no gráfico: o ponto trava no fechamento do mês mais próximo. Ou digite os valores. Fundo → topo marca o menor e o maior preço do período.';

    :`<div class="selbox" id="sel-info"><span class="muted">Clique e arraste no gráfico para medir um período: variação e proventos pagos.</span></div>`}<p class="note" id="hist-note" style="margin:10px 0 0"></p></div></section>
   <section class="card"><div class="card-h"><h2>Proventos por ano</h2></div><div class="card-b" id="divs"><span class="muted">Carregando…</span></div></section>
  </div>
  <section class="card"><div class="card-h"><h2>Indicadores</h2><span class="note">Balanço de ${esc((r.data_balanco||'').split('-').reverse().join('/'))} · passe o mouse no nome para ver a conta</span></div>
   <div class="card-b groups">${IND.map(([g,l])=>{ const its=l.filter(([k])=>!(r.banco&&['psr','m_bruta','m_ebit','m_liq','div_liq','div_liq_ebitda','div_liq_pl','liq_corrente','ev_ebitda','ev_ebit'].includes(k))); if(!its.length) return '';
     return `<div class="grp"><h3>${g}</h3>${its.map(([k,n,tt,t])=>{ const v=k==='dy'?dy:r[k]; return `<div class="ind"><span ${tt?`title="${esc(tt)}"`:''}>${n}</span><span class="v ${['roe','m_liq','m_ebit'].includes(k)?cls(v):''}">${fmt(v,t,curRow(r))}${refSetor(r,k,v,t)}</span></div>`; }).join('')}</div>`; }).join('')}</div>
   <p class="note" style="margin:0;padding:0 16px 14px">Embaixo de cada indicador: a mediana das empresas do mesmo setor (ou do mercado, quando o setor tem menos de 4 empresas). Verde quando a ação está do lado bom da mediana, vermelho quando está do lado ruim. É uma comparação com os pares, não uma recomendação.</p>${r.banco?'<p class="note" style="margin:0;padding:0 16px 14px">Em bancos, margens e dívida não se aplicam: o dinheiro emprestado é a matéria-prima do negócio.</p>':''}</section>
  <section class="card"><div class="card-h"><h2>Fatos relevantes e comunicados</h2><span class="note">documentos entregues à CVM nos últimos 120 dias</span></div><div class="card-b" id="eventos"><span class="muted">Carregando…</span></div></section>
  <div style="display:flex;gap:8px"><button class="btn pri" data-simular="${esc(r.ticker)}">Simular investimento em ${esc(r.ticker)}</button></div>`;

async function drawEventos(r){
  const box=$('#eventos'); if(!box) return;
  if(r.mercado==='EUA'||/^(ETF|Índice)$/.test(r.setor||'')){ box.innerHTML='<span class="muted">Só para empresas da B3.</span>'; return; }
  if(S.eventos===undefined){ try{ S.eventos=await getJSON('data/eventos.json'); }catch{ S.eventos=null; } }
  const b=$('#eventos'); if(!b||S.tk!==r.ticker) return;
  if(!S.eventos){ b.innerHTML='<span class="muted">Os documentos da CVM aparecem depois da próxima atualização automática.</span>'; return; }
  const it=(S.eventos.acoes||{})[r.ticker]||[];
  if(!it.length){ b.innerHTML='<span class="muted">Nenhum fato relevante, comunicado ou aviso aos acionistas nos últimos 120 dias.</span>'; return; }
  const seguro=u=>{ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } };
  b.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th class="l">Data</th><th class="l">Tipo</th><th class="l">Assunto</th><th class="l"></th></tr></thead><tbody>${it.map(([d,c,a,l])=>{ const u=seguro(l);
    return `<tr style="cursor:default"><td class="l">${esc(d.split('-').reverse().join('/'))}</td><td class="l"><span class="chip"${c==='Fato Relevante'?' style="border-color:var(--accent);color:var(--accent)"':''}>${esc(c)}</span></td><td class="l" style="white-space:normal;font-family:var(--f-body)">${esc(a||'—')}</td><td class="l">${u?`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">abrir ↗</a>`:''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
async function drawAcao(){
  const r=byTk(S.tk); if(!r) return;
  drawEventos(r);
  const h=await loadHist(r.ticker); if(S.tab!=='acao'||S.tk!==r.ticker) return;
  const note=$('#hist-note'), dv=$('#divs');
  if(!h){ note.textContent='Histórico ainda não disponível para esta ação.'; dv.innerHTML='<span class="muted">Sem dados.</span>'; return; }
  let n=h.d.length, from=0;
  if(S.range!=='max'){ const m=+S.range*12; from=Math.max(0,n-m-1); }
  const lab=h.d.slice(from); const serie=(S.modo==='total'?h.a:h.c).slice(from);
  const base=serie[0], ult=serie[serie.length-1];
  const ret=ult/base-1, anos=(lab.length-1)/12, cagr=anos>0?Math.pow(ult/base,1/anos)-1:null;
  note.innerHTML=`${S.modo==='total'?'Retorno com dividendos reinvestidos':'Variação do preço'} no período: <b class="mono ${cls(ret)}">${fP(ret,1,true)}</b>${ok(cagr)&&anos>=1?` · <span class="mono">${fP(cagr,1)} ao ano</span>`:''} · ${lab[0].split('-').reverse().join('/')} a ${lab.at(-1).split('-').reverse().join('/')}${h.src?` · fonte: ${esc(h.src)}`:''}`;
  const ctx=$('#ch-hist'); if(!ctx||!window.Chart) return;
  const sel={a:null,b:null,drag:false};
  // ---- Fibonacci (motor do Painel Operacional WIN: 0% e 100% são valores; níveis = a + (b − a) × p)
  const fkey=r.ticker+'|'+S.modo, fib=S.fib[fkey]||(S.fib[fkey]={a:null,b:null});
  let pick=0;
  const fibAtivo=()=>S.ferr==='fibo'&&fib.a!=null&&fib.b!=null&&fib.a!==fib.b;
  const niveis=()=>FIB_NIVEIS.filter(p=>S.fibExt||p<FIB_EXT);
  const valorNivel=p=>fib.a+(fib.b-fib.a)*p/100;
  const fibPlugin={id:'fib',afterDatasetsDraw(ch){ if(!fibAtivo()) return; const y=ch.scales.y, a=ch.chartArea, c=ch.ctx;
    c.save(); c.font='11px '+css('--f-mono'); c.textBaseline='middle'; c.textAlign='left';
    for(const p of niveis()){ const v=valorNivel(p), py=y.getPixelForValue(v); if(py<a.top-2||py>a.bottom+2) continue;
      const chave=p===0||p===100, cor=chave?css('--fib-chave'):p>100?css('--fib-ext'):css('--fib-nivel');
      c.strokeStyle=cor; c.lineWidth=chave?1.4:1; c.setLineDash(chave?[]:[3,3]);
      c.beginPath(); c.moveTo(a.left,py+.5); c.lineTo(a.right,py+.5); c.stroke(); c.setLineDash([]);
      c.fillStyle=cor; c.fillText(fN(v)+'  ('+fN(p,1)+'%)',a.right+8,py); }
    c.fillStyle=css('--fib-chave'); for(const v of [fib.a,fib.b]){ const py=y.getPixelForValue(v); if(py>=a.top&&py<=a.bottom){ c.beginPath(); c.arc(a.left+6,py,3.5,0,6.284); c.fill(); } }
    c.restore(); }};
  const selPlugin={id:'sel',beforeDatasetsDraw(ch){ if(sel.a==null||sel.b==null||sel.a===sel.b) return; const x=ch.scales.x, a=ch.chartArea, c=ch.ctx;
    const x0=x.getPixelForValue(Math.min(sel.a,sel.b)), x1=x.getPixelForValue(Math.max(sel.a,sel.b));
    c.save(); c.fillStyle=css('--accent-soft'); c.fillRect(x0,a.top,x1-x0,a.bottom-a.top); c.strokeStyle=css('--accent'); c.setLineDash([4,3]); c.beginPath(); c.moveTo(x0,a.top); c.lineTo(x0,a.bottom); c.moveTo(x1,a.top); c.lineTo(x1,a.bottom); c.stroke(); c.restore(); }};
  const ch=S.charts.h=new Chart(ctx,{type:'line',data:{labels:lab,datasets:[{data:serie,borderColor:css('--accent'),borderWidth:2,pointRadius:0,tension:.15,fill:'start',backgroundColor:c=>{ const a=c.chart.chartArea; if(!a) return 'transparent'; const g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom); g.addColorStop(0,css('--accent-soft')); g.addColorStop(1,'rgba(0,0,0,0)'); return g; }}]},
    options:chartOpts(v=>money(v,curRow(r))),plugins:[selPlugin,fibPlugin]});
  if(S.ferr==='fibo') ch.options.layout={padding:{right:128}};
  const ajustaEscala=()=>{ const ys=ch.options.scales.y; delete ys.min; delete ys.max;
    if(!(S.fibFit&&fibAtivo())) return;
    const vals=serie.filter(ok).concat(niveis().map(valorNivel)); let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*.08||1;
    ys.min=lo-pad; ys.max=hi+pad; };
  const fibTabela=()=>{ const t=$('#fib-tbl'); if(!t) return;
    if(fib.a==null||fib.b==null){ t.innerHTML='<thead><tr><th class="l">Nível</th><th>Valor</th></tr></thead><tbody><tr style="cursor:default"><td colspan="2" class="l muted">Defina 0% e 100%.</td></tr></tbody>'; return; }
    const atual=serie[serie.length-1], ns=niveis(); let perto=ns[0]; for(const p of ns) if(Math.abs(valorNivel(p)-atual)<Math.abs(valorNivel(perto)-atual)) perto=p;
    t.innerHTML='<thead><tr><th class="l">Nível</th><th>Valor</th></tr></thead><tbody>'+ns.map(p=>`<tr style="cursor:default" class="${p===0?'lv0':p===100?'lv100':p>100?'lvx':''} ${p===perto?'perto':''}"><td class="l">${fN(p,1)}%</td><td>${money(valorNivel(p),curRow(r))}</td></tr>`).join('')+
      `<tr style="cursor:default"><td class="l muted">Último</td><td class="muted">${money(atual,curRow(r))}</td></tr></tbody>`; };
  const sincInputs=()=>{ const i0=$('#fib-p0'), i1=$('#fib-p1'); if(i0) i0.value=fib.a==null?'':fib.a.toFixed(2); if(i1) i1.value=fib.b==null?'':fib.b.toFixed(2); fibTabela(); };
  const redesenha=()=>{ ajustaEscala(); ch.update('none'); fibTabela(); };
  const setPick=m=>{ pick=m; $('#fib-pick0')?.classList.toggle('armed',m===1); $('#fib-pick1')?.classList.toggle('armed',m===2);
    const msg=$('#fib-msg'); if(msg) msg.textContent=m?'Clique no gráfico para fixar o ponto de '+(m===1?'0%':'100%'):''; };
  if(S.ferr==='fibo'){
    sincInputs(); redesenha();
    $('#fib-p0').addEventListener('input',e=>{ const v=parseFloat(e.target.value); fib.a=isFinite(v)?v:null; redesenha(); });
    $('#fib-p1').addEventListener('input',e=>{ const v=parseFloat(e.target.value); fib.b=isFinite(v)?v:null; redesenha(); });
    $('#fib-pick0').addEventListener('click',()=>setPick(pick===1?0:1));
    $('#fib-pick1').addEventListener('click',()=>setPick(pick===2?0:2));
    $('#fib-auto').addEventListener('click',()=>{ const v=serie.filter(ok); fib.a=Math.min(...v); fib.b=Math.max(...v); sincInputs(); redesenha(); });
    $('#fib-clear').addEventListener('click',()=>{ fib.a=fib.b=null; setPick(0); sincInputs(); redesenha(); });
    $('#fib-png').addEventListener('click',()=>{ const a=document.createElement('a'); a.download=r.ticker+'_fibonacci.png'; a.href=ctx.toDataURL('image/png'); a.click(); });
    $('#fib-ext').addEventListener('change',e=>{ S.fibExt=e.target.checked; redesenha(); });
    $('#fib-fit').addEventListener('change',e=>{ S.fibFit=e.target.checked; redesenha(); });
  }
  const idx=e=>{ const r=ctx.getBoundingClientRect(); const v=Math.round(ch.scales.x.getValueForPixel(e.clientX-r.left)); return Math.max(0,Math.min(lab.length-1,v)); };
  const info=()=>{ const box=$('#sel-info'); if(!box) return;
    if(sel.a==null||sel.b==null||sel.a===sel.b){ box.innerHTML='<span class="muted">Clique e arraste no gráfico para medir um período: variação e proventos pagos.</span>'; return; }
    const i=from+Math.min(sel.a,sel.b), j=from+Math.max(sel.a,sel.b);
    const pv=h.c[j]/h.c[i]-1, tv=h.a[j]/h.a[i]-1; let dv=0; for(let k=i+1;k<=j;k++) dv+=h.v[k]||0;
    const meses=j-i, anos=meses/12, aa=anos>=1?Math.pow(h.a[j]/h.a[i],1/anos)-1:null, br=d=>d.split('-').reverse().join('/');
    box.innerHTML=`<div class="it"><small>Período</small><b>${br(h.d[i])} → ${br(h.d[j])}</b></div>
      <div class="it"><small>Preço</small><b>${fN(h.c[i])} → ${fN(h.c[j])} <span class="${cls(pv)}">${fP(pv,1,true)}</span></b></div>
      <div class="it"><small>Com dividendos</small><b class="${cls(tv)}">${fP(tv,1,true)}${ok(aa)?` <span class="muted">(${fP(aa,1)} a.a.)</span>`:''}</b></div>
      <div class="it"><small>Proventos pagos</small><b>${money(dv,curRow(r))} por ação <span class="muted">(${fP(dv/h.c[i],1)} do preço inicial)</span></b></div>
      <button class="btn x" id="sel-clear">Limpar</button>`; };
  if(S.ferr==='fibo'){
    ctx.addEventListener('click',e=>{ if(!pick) return; const v=serie[idx(e)]; if(!ok(v)) return;
      if(pick===1) fib.a=v; else fib.b=v; setPick(0); sincInputs(); redesenha(); });
  } else {
    ctx.addEventListener('pointerdown',e=>{ sel.drag=true; sel.a=sel.b=idx(e); try{ ctx.setPointerCapture(e.pointerId); }catch{} ch.draw(); info(); });
    ctx.addEventListener('pointermove',e=>{ if(!sel.drag) return; sel.b=idx(e); ch.draw(); info(); });
    const end=()=>{ sel.drag=false; };
    ctx.addEventListener('pointerup',end); ctx.addEventListener('pointercancel',end);
    $('#sel-info').addEventListener('click',e=>{ if(e.target.id==='sel-clear'){ sel.a=sel.b=null; ch.draw(); info(); } });
  }
  // proventos por ano
  const byY={}; h.d.forEach((d,i)=>{ const y=d.slice(0,4); byY[y]=(byY[y]||0)+(h.v[i]||0); });
  const lastC={}; h.d.forEach((d,i)=>{ lastC[d.slice(0,4)]=h.c[i]; });
  const ys=Object.keys(byY).sort().reverse().slice(0,10);
  dv.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th class="l">Ano</th><th>Por ação</th><th>DY no ano</th></tr></thead><tbody>${ys.map(y=>`<tr style="cursor:default"><td class="l">${y}</td><td>${money(byY[y],curRow(r))}</td><td>${fP(byY[y]/lastC[y])}</td></tr>`).join('')}</tbody></table></div>`;
}
function chartOpts(fmtY){
  const g=css('--line'), t=css('--muted');
  return {responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},animation:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+': ':'')+fmtY(c.parsed.y),title:i=>i[0].label.split('-').reverse().join('/')}}},
    scales:{x:{grid:{display:false},ticks:{color:t,maxTicksLimit:8,callback:function(v){ const l=this.getLabelForValue(v); return l.slice(5)==='01'||this.chart.data.labels.length<30?l.split('-').reverse().join('/'):l.slice(0,4); }}},
            y:{grid:{color:g},ticks:{color:t,callback:fmtY},border:{display:false}}}};
}

// ===================== simulador =====================
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MAX_CART=10;
function anosSim(){ const y=new Date().getFullYear(); const a=[]; for(let i=y;i>=1995;i--) a.push(String(i)); return a; }
const moedaTk=t=>(byTk(t)&&byTk(t).moeda)||(marketOf(t)==='US'?'USD':'BRL');
const brMes=d=>{ const [y,m]=d.split('-'); return MESES[+m-1]+'/'+y; };
function mesesEntre(a,b){ const out=[]; let [y,m]=a.split('-').map(Number); const [y2,m2]=b.split('-').map(Number); while(y<y2||(y===y2&&m<=m2)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} } return out; }
function fxMap(){ const u=S.macro&&S.macro.usdbrl; return u&&Object.keys(u).length?u:null; }
function fxFn(t){ if(moedaTk(t)!=='USD') return null; const u=fxMap(); if(!u) return null; let last=null; return d=>{ if(u[d]!=null) last=u[d]; return last; }; }

// Mês a mês: a posição acompanha o preço (ajustado por desdobramentos); os proventos do mês caem em dinheiro
// e, se marcado, compram mais ações no fechamento daquele mês. Valores em reais (ações dos EUA convertidas pelo dólar do mês).
// Impostos (pessoa física residente no Brasil, regras vigentes em 2026, simplificadas):
//  B3: dividendos isentos; prêmio de opção 15% sobre o ganho, pago todo mês; venda de ações 15% sobre o ganho.
//  EUA: dividendos com 30% retidos lá na fonte (o Brasil aceita como crédito e não cobra mais nada); opções e venda com 15% de IR no Brasil.
function aliquotas(t){ const us=moedaTk(t)==='USD'; return {div:us?0.30:0, opc:0.15, venda:0.15}; }
function simPath(h, labels, valor, aporte, reinv, semDiv, fx, opc, tax){
  if(!h._ix) h._ix=Object.fromEntries(h.d.map((d,i)=>[d,i]));
  const mOpc=opc?Math.pow(1+opc,1/12)-1:0;   // renda de opções: % ao ano sobre o valor da posição, recebida mês a mês
  const out=[], inv=[]; let acoes=0, cash=0, divs=0, premios=0, invested=0, prev=null, base=0, irPago=0;
  const tDiv=tax?tax.div:0, tOpc=tax?tax.opc:0;
  labels.forEach((lb,k)=>{
    let i=h._ix[lb]; if(i==null) i=prev;
    const f=fx?(fx(lb)||1):1;
    if(k===0){ acoes=valor/f; invested=valor; base=valor; }
    else{
      if(i!==prev&&prev!=null){
        acoes*=h.c[i]/h.c[prev];
        const bruto=semDiv?0:acoes*(h.v[i]||0)/h.c[i], d=bruto*(1-tDiv); divs+=d*f; irPago+=bruto*tDiv*f;
        if(reinv){ acoes+=d; base+=d*f; } else cash+=d*f;
      }
      if(mOpc&&!semDiv){ const bruto=acoes*mOpc, pr=bruto*(1-tOpc); premios+=pr*f; irPago+=bruto*tOpc*f; if(reinv){ acoes+=pr; base+=pr*f; } else cash+=pr*f; }
      if(aporte){ acoes+=aporte/f; invested+=aporte; base+=aporte; }
    }
    prev=i; out.push(acoes*f+cash); inv.push(invested);
  });
  const posicao=acoes*(fx?(fx(labels.at(-1))||1):1), irVenda=tax?Math.max(0,posicao-base)*tax.venda:0;
  return {out,inv,divs,premios,invested,irPago,irVenda};
}
// câmbio congelado no primeiro mês: mostra só o resultado da empresa, sem a variação do dólar
function fxSim(t,labels){ const fx=fxFn(t); if(!fx||!S.sim.semCambio) return fx; const f0=fx(labels[0]); return ()=>f0; }
// índice de inflação acumulada (IPCA) para trazer cada mês a reais do último mês
function fatorInflacao(labels){ const ip=S.macro&&S.macro.ipca; if(!ip) return null; let acc=1; const idx=labels.map((lb,i)=>{ if(i>0) acc*=1+((ip[lb]??0)/100); return acc; }); const fim=idx.at(-1); return idx.map(v=>fim/v); }
// investido acumulado mês a mês, em reais de hoje (para o gráfico)
function investidoAcumCorr(labels,valor,aporte){ const f=fatorInflacao(labels); let t=0; return labels.map((_,i)=>{ t+=(i===0?valor:aporte)*f[i]; return t; }); }
function investidoCorrigido(labels,valor,aporte){ const f=fatorInflacao(labels); if(!f) return null; let tot=valor*f[0]; for(let i=1;i<labels.length;i++) tot+=aporte*f[i]; return tot; }
function simBench(labels, valor, aporte, kind){
  const m=S.macro; if(!m) return null; const out=[]; let v=valor;
  if(kind==='cdi'||kind==='ipca'){ const s=m[kind]; if(!s) return null; for(let i=0;i<labels.length;i++){ if(i>0){ const r=s[labels[i]]; if(r==null) return null; v=v*(1+r/100)+aporte; } out.push(v);} return out; }
  if(kind==='ibov'){ const s=m.ibov; if(!s) return null; let q=valor/(s[labels[0]]||NaN); if(!isFinite(q)) return null; for(let i=0;i<labels.length;i++){ const p=s[labels[i]]; if(p==null) return null; if(i>0&&aporte) q+=aporte/p; out.push(q*p);} return out; }
}

function readSimNoRender(){
  const s=S.sim, g=id=>document.getElementById(id);
  if(g('s-val')){ s.valor=num(g('s-val').value)||0; s.aporte=num(g('s-ap').value)||0; s.reinv=g('s-re').checked; if(g('s-real')) s.real=g('s-real').checked; if(g('s-ir')) s.imposto=g('s-ir').checked; if(g('s-opc')) s.opc=Math.max(0,num(g('s-opc').value)||0); if(g('s-fx')) s.semCambio=g('s-fx').checked; s.inicio=g('s-ano').value+'-'+g('s-mes').value; }
  if(g('s-tk')) s.tk=g('s-tk').value.trim().toUpperCase();
  if(s.modo==='carteira') S.cart.itens=S.cart.itens.map((x,i)=>({tk:(g('c-tk-'+i)?g('c-tk-'+i).value:x.tk).trim().toUpperCase(),p:g('c-p-'+i)?g('c-p-'+i).value.trim():x.p}));

function pesos(){
  const it=S.cart.itens.filter(x=>x.tk); const raw=it.map(x=>num(x.p));
  const temAlgum=raw.some(v=>isFinite(v)&&v>0);
  let w=temAlgum? raw.map(v=>isFinite(v)&&v>0?v:0) : it.map(()=>1);
  const soma=w.reduce((a,b)=>a+b,0)||1;
  return {it, w:w.map(v=>v/soma), somaDigitada: temAlgum? raw.reduce((a,v)=>a+(isFinite(v)?v:0),0):null};
}
function blocoComposicao(labels, cur, inv, vPreco, vDiv, vSem, vRe, reinv, sps, vOpc, ir){

  return `<section class="card"><div class="card-h"><h2>De onde veio o resultado</h2><span class="note">${brMes(labels[0])} a ${brMes(labels.at(-1))}</span></div>

function kpisBloco(fim, inv, labels, s, cur){
  const anos=(labels.length-1)/12;
  if(s.real&&cur==='BRL'){ const invR=investidoCorrigido(labels,s.valor,s.aporte);
    if(invR){ const ganho=fim-invR, f0=fatorInflacao(labels)[0], tirR=anos>0&&!s.aporte?Math.pow(fim/(s.valor*f0),1/anos)-1:null;
      return {html:`<section class="kpis">
        <div class="kpi"><span class="lab">Você teria hoje</span><span class="val">${fR(fim)}</span><span class="sub ${cls(ganho)}">${fP(fim/invR-1,1,true)} acima da inflação</span></div>
        <div class="kpi"><span class="lab">Investido, corrigido pela inflação</span><span class="val">${fR(invR)}</span><span class="sub muted">${fR(inv)} em valores da época · IPCA</span></div>
        <div class="kpi"><span class="lab">Ganho real</span><span class="val ${cls(ganho)}">${fR(ganho)}</span><span class="sub muted">${ok(tirR)?fP(tirR,1)+' ao ano acima do IPCA':'em reais de hoje'}</span></div>
       </section>`, cdi:null, real:true}; } }
  const lucro=fim-inv, tir=anos>0&&!s.aporte?Math.pow(fim/s.valor,1/anos)-1:null;
  const cdi=cur==='BRL'?simBench(labels,s.valor,s.aporte,'cdi'):null, ipca=cur==='BRL'?simBench(labels,s.valor,s.aporte,'ipca'):null;
  return {html:`<section class="kpis">
    <div class="kpi"><span class="lab">Você teria hoje</span><span class="val">${money(fim,cur)}</span><span class="sub ${cls(lucro)}">${fP(fim/inv-1,1,true)} · ${s.reinv?'reinvestindo':'sem reinvestir'}${s.opc?' · com opções':''}${s.imposto?' · após impostos do caminho':''}</span></div>
    <div class="kpi"><span class="lab">Total investido</span><span class="val">${money(inv,cur)}</span><span class="sub muted">${labels.length-1} meses</span></div>
    <div class="kpi"><span class="lab">Ganho</span><span class="val ${cls(lucro)}">${money(lucro,cur)}</span><span class="sub muted">${ok(tir)?fP(tir,1)+' ao ano':''}</span></div>
    ${cdi?`<div class="kpi"><span class="lab">No CDI teria</span><span class="val">${fR(cdi.at(-1))}</span><span class="sub ${cls(fim-cdi.at(-1))}">${fim>=cdi.at(-1)?'ganhou':'perdeu'} do CDI por ${fR(Math.abs(fim-cdi.at(-1)))}</span></div>`:''}
    ${ipca?`<div class="kpi"><span class="lab">Só para empatar com a inflação</span><span class="val">${fR(ipca.at(-1))}</span><span class="sub muted">valor corrigido pelo IPCA</span></div>`:''}
   </section>`, cdi};
}

   <section class="card"><div class="card-h"><h2>Evolução do patrimônio</h2><div class="legend"><span><i style="background:var(--s1)"></i>${esc(s.tk)}</span>${k.cdi?'<span><i style="background:var(--s2)"></i>CDI</span>':''}${ibov?'<span><i style="background:var(--s3)"></i>Ibovespa</span>':''}<span><i style="background:var(--s4)"></i>Investido</span></div></div>

    <p class="note" style="margin:10px 0 0">${s.reinv?'Os proventos de cada mês compram mais ações no preço de fechamento daquele mês, com frações de ação.':'Os proventos ficam parados em dinheiro, sem render juros.'} Sem imposto e sem custos de corretagem.${s.opc?` A renda de opções é uma estimativa simples: ${fN(s.opc,1)}% ao ano sobre o valor de cada posição, recebidos todo mês. Ela não considera o lado ruim da venda coberta: quando a ação dispara, a call é exercida e você entrega a ação pelo preço combinado, abrindo mão de parte da alta; na put, você pode ter que comprar a ação mais cara do que o mercado. Em ações que sobem muito, o resultado real tende a ficar abaixo do mostrado.`:''} Rentabilidade passada não garante rentabilidade futura.</p></div></section></div>`;

// ===================== simulador de renda fixa =====================
// Produtos e regras (pessoa física, 2026):
//  CDB/LC/Tesouro: IR regressivo sobre o rendimento de cada aporte (22,5% até 180 dias, 20% até 360, 17,5% até 720, 15% acima).
//  LCI/LCA/Poupança: isentos de IR.  Tesouro Direto: taxa de custódia da B3 de 0,20% ao ano (no Tesouro Selic, só acima de R$ 10 mil).
//  Poupança: com Selic acima de 8,5%, rende 0,5% ao mês + TR (a TR não entra na conta).
const RF_PRODUTOS={
  cdb:{nome:'CDB / LC',ir:true,tipos:['cdi','pre','ipca'],padrao:{tipo:'cdi',taxa:100}},
  lci:{nome:'LCI / LCA',ir:false,tipos:['cdi','pre','ipca'],padrao:{tipo:'cdi',taxa:90}},
  selic:{nome:'Tesouro Selic',ir:true,custodia:0.002,isentoAte:10000,tipos:['cdi'],padrao:{tipo:'cdi',taxa:100}},
  pre:{nome:'Tesouro Prefixado',ir:true,custodia:0.002,tipos:['pre'],padrao:{tipo:'pre',taxa:13.5}},
  ipca:{nome:'Tesouro IPCA+',ir:true,custodia:0.002,tipos:['ipca'],padrao:{tipo:'ipca',taxa:7}},
  poup:{nome:'Poupança',ir:false,tipos:['poup'],padrao:{tipo:'poup',taxa:0}},
  livre:{nome:'Taxa livre (sem IR)',ir:false,tipos:['pre'],padrao:{tipo:'pre',taxa:1,taxaUn:'am'}},
};
const RF_TIPO={cdi:'% do CDI',pre:'Prefixado',ipca:'IPCA +',poup:'Regra da poupança'};
function acum12(serie){ if(!serie) return null; const k=Object.keys(serie).sort().slice(-12); if(k.length<12) return null;
  const d=new Date(); d.setMonth(d.getMonth()-4); const limite=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(k.at(-1)<limite) return null;   // série desatualizada: melhor não usar
  return k.reduce((a,x)=>a*(1+serie[x]/100),1)-1; }
function rfPadroes(){ const r=S.rf;
  if(r.cdi==null){ const c=acum12(S.macro&&S.macro.cdi); r.cdi=c!=null?+(c*100).toFixed(2):14.15; r.cdiFonte=c!=null?'últimos 12 meses':'estimativa'; }
  if(r.ipca==null){ const i=acum12(S.macro&&S.macro.ipca); r.ipca=i!=null?+(i*100).toFixed(2):4.5; r.ipcaFonte=i!=null?'últimos 12 meses':'estimativa'; } }
function aliqIR(dias){ return dias<=180?0.225:dias<=360?0.20:dias<=720?0.175:0.15; }
function taxaMensal(r){
  const aa=x=>Math.pow(1+x,1/12)-1;
  if(r.tipo==='cdi') return aa(r.cdi/100*r.taxa/100);
  if(r.tipo==='pre') return r.taxaUn==='am'?r.taxa/100:aa(r.taxa/100);
  if(r.tipo==='ipca') return aa((1+r.ipca/100)*(1+(r.taxaUn==='am'?Math.pow(1+r.taxa/100,12)-1:r.taxa/100))-1);
  if(r.tipo==='poup') return 0.005;
  return 0;
}
// Simula mês a mês, com cada aporte guardado como um lote (para o IR regressivo pela idade de cada aporte)
function simRF(cfg){
  const P=RF_PRODUTOS[cfg.produto], m=taxaMensal(cfg), n=cfg.meses, cust=P.custodia?Math.pow(1+P.custodia,1/12)-1:0;
  const lotes=[{ini:cfg.valor,saldo:cfg.valor,mes:0}], serie=[cfg.valor], inv=[cfg.valor]; let investido=cfg.valor, custodiaPaga=0;
  for(let t=1;t<=n;t++){
    const total=lotes.reduce((a,l)=>a+l.saldo,0);
    lotes.forEach(l=>{ l.saldo*=1+m; });
    if(cust){ const tot=lotes.reduce((a,l)=>a+l.saldo,0), isento=P.isentoAte||0, base=Math.max(0,tot-isento), c=base*cust; if(c>0&&tot>0){ lotes.forEach(l=>{ l.saldo-=c*l.saldo/tot; }); custodiaPaga+=c; } }
    if(cfg.aporte&&t<n){ lotes.push({ini:cfg.aporte,saldo:cfg.aporte,mes:t}); investido+=cfg.aporte; }
    serie.push(lotes.reduce((a,l)=>a+l.saldo,0)); inv.push(investido);
  }
  const bruto=serie.at(-1); let ir=0;
  if(P.ir) lotes.forEach(l=>{ const g=l.saldo-l.ini; if(g>0) ir+=g*aliqIR((n-l.mes)*30); });
  return {bruto,ir,liquido:bruto-ir,investido,custodia:custodiaPaga,serie,inv,mensal:m};
}

function lerRF(){ const r=S.rf, g=id=>document.getElementById(id); if(!g('rf-valor')) return;
  const prod=g('rf-produto').value; if(prod!==r.produto){ r.produto=prod; const d=RF_PRODUTOS[prod].padrao; r.tipo=d.tipo; r.taxa=d.taxa; r.taxaUn=d.taxaUn||'aa'; }
  else { if(g('rf-tipo')){ const t=g('rf-tipo').value; if(t!==r.tipo){ r.tipo=t; r.taxa=t==='cdi'?100:t==='ipca'?7:13.5; r.taxaUn='aa'; } else if(g('rf-taxa')) r.taxa=num(g('rf-taxa').value)||0; } else if(g('rf-taxa')) r.taxa=num(g('rf-taxa').value)||0;

    <div class="kpi"><span class="lab">Total investido</span><span class="val">${fR(res.investido)}</span><span class="sub muted">${fR(r.valor)} + ${n-1>0&&r.aporte?`${n-1} aportes de ${fR(r.aporte)}`:'sem aportes'}</span></div>
    <div class="kpi"><span class="lab">Rendimento líquido</span><span class="val ${cls(ganho)}">${fR(ganho)}</span><span class="sub muted">bruto ${fR(res.bruto-res.investido)}</span></div>
    <div class="kpi"><span class="lab">Imposto de renda</span><span class="val">${P.ir?fR(res.ir):'isento'}</span><span class="sub muted">${P.ir?`${fP(res.ir/Math.max(1,res.bruto-res.investido),1)} do rendimento`:P.nome}</span></div>
    <div class="kpi"><span class="lab">Acima da inflação</span><span class="val ${cls(realLiq)}">${fP(realLiq,2)} ao ano</span><span class="sub muted">líquido · bruto ${fP(realAa,2)} · taxa ${fP(aaLiq,2)} a.a.</span></div>
   </section>
   <div class="two">
    <section class="card"><div class="card-h"><h2>${esc(P.nome)} · ${esc(taxaTxt)}</h2></div>
     <div class="card-b"><div class="chart-box"><canvas id="ch-rf" aria-label="Evolução do valor aplicado em renda fixa"></canvas></div>
     <div class="legend" style="margin-top:10px"><span><i style="background:var(--s1)"></i>Saldo bruto</span><span><i style="background:var(--s4)"></i>Investido</span></div>
     <p class="note" style="margin:10px 0 0">${P.ir?'Imposto regressivo calculado aporte por aporte: 22,5% no que ficou até 180 dias, 20% até 360, 17,5% até 720 e 15% acima de 2 anos. ':'Isento de imposto de renda. '}${P.custodia?`Desconta a taxa de custódia da B3 de 0,20% ao ano${P.isentoAte?' sobre o que passar de R$ 10 mil':''}: ${fR(res.custodia)} no período. `:''}${r.produto==='poup'?'Poupança com Selic acima de 8,5%: 0,5% ao mês mais a TR, que não entra na conta. ':''}Considera a taxa constante durante todo o prazo e o resgate no último mês. Sem IOF (só vale para resgates antes de 30 dias).</p></div></section>
    <section class="card"><div class="card-h"><h2>Comparação</h2><span class="note">mesmos valores e prazo, valor líquido</span></div>
     <div class="tbl-wrap"><table><thead><tr><th class="l">Investimento</th><th>Líquido</th><th>Ganho</th></tr></thead><tbody>
     ${comp.map(c=>`<tr style="cursor:default"><td class="l">${esc(c.nome)}${c.x.liquido===melhor?' <span class="chip" style="border-color:var(--up);color:var(--up)">melhor</span>':''}</td><td>${fR(c.x.liquido)}</td><td class="${cls(c.x.liquido-c.x.investido)}">${fR(c.x.liquido-c.x.investido)}</td></tr>`).join('')}
     </tbody></table></div>
     <p class="note" style="margin:0;padding:10px 16px 14px">Com CDI de ${fN(r.cdi,2)}% e IPCA de ${fN(r.ipca,2)}% ao ano. LCI e LCA costumam pagar menos que o CDB porque são isentas; compare sempre o valor líquido.</p></section>
   </div></div>`;
  const labels=res.serie.map((_,i)=>i===0?'início':(i%12===0?`${i/12}º ano`:`mês ${i}`));
  const topo=Math.max(...res.serie), fy=topo<1e6?(v=>'R$ '+fN(v/1000,topo<1e5?1:0)+' mil'):(v=>fB(v));
  const o=chartOpts(fy); o.plugins.tooltip.callbacks.title=i=>i[0].label; o.plugins.tooltip.callbacks.label=c=>c.dataset.label+': '+fR(c.parsed.y);
  o.scales.x.ticks.callback=function(v){ return this.getLabelForValue(v); };
  if(window.Chart&&$('#ch-rf')) S.charts.rf=new Chart($('#ch-rf'),{type:'line',data:{labels,datasets:[
    {label:'Saldo bruto',data:res.serie,borderColor:css('--s1'),borderWidth:2,pointRadius:0,tension:.1},
    {label:'Investido',data:res.inv,borderColor:css('--s4'),borderWidth:1.5,borderDash:[5,4],pointRadius:0}]},options:o});
}

// ===================== busca =====================
let sugIdx=-1;
function sugs(q){
  const el=$('#sugs'); q=q.trim().toUpperCase(); if(!q){ el.hidden=true; return; }
  const m=S.rows.filter(r=>r.ticker.startsWith(q)||(r.empresa||'').toUpperCase().includes(q)).sort((a,b)=>(b.ticker.startsWith(q)-a.ticker.startsWith(q))||((b.valor_mercado||0)-(a.valor_mercado||0))).slice(0,10);
  el.innerHTML=m.map((r,i)=>`<button data-open="${esc(r.ticker)}" class="${i===sugIdx?'on':''}"><b>${esc(r.ticker)}</b><span class="muted">${esc(r.empresa)}</span></button>`).join('')||'<div class="empty">Nada encontrado.</div>';
  el.hidden=false;
}
function openTk(t){ S.tk=t; $('#q').value=''; $('#sugs').hidden=true; try{ history.replaceState(null,'','#'+t); }catch{} setTab('acao'); window.scrollTo({top:0}); }

// ===================== eventos =====================
document.addEventListener('click',e=>{
  const rb=e.target.closest('[data-rkn]'); if(rb){ S.rk.n=rb.dataset.rkn; render(); return; }
  const fb=e.target.closest('[data-ferr]'); if(fb){ S.ferr=fb.dataset.ferr; render(); return; }
  const b=e.target.closest('[data-smodo],[data-add],[data-rm],[data-iguais],[data-ha],[data-todas],[data-tab],[data-open],[data-sort],[data-preset],[data-range],[data-modo],[data-simular],[data-act]');
  if(!b){ if(!e.target.closest('.search')) $('#sugs').hidden=true; return; }
  const d=b.dataset;
  if(d.ha){ readSimNoRender(); const t=new Date(); t.setMonth(t.getMonth()-12*(+d.ha)); S.sim.inicio=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'); render(); return; }
  if(d.smodo){ readSimNoRender(); S.sim.modo=d.smodo; render(); return; }
  if(d.add){ readSimNoRender(); if(S.cart.itens.length<MAX_CART) S.cart.itens.push({tk:'',p:''}); render(); setTimeout(()=>{ const el=document.getElementById('c-tk-'+(S.cart.itens.length-1)); if(el) el.focus(); }); return; }
  if(d.rm!=null){ readSimNoRender(); S.cart.itens.splice(+d.rm,1); render(); return; }
  if(d.iguais){ readSimNoRender(); S.cart.itens.forEach(x=>x.p=''); render(); return; }
  if(d.todas){ S.f={mercado:'',setor:'',tipo:'',plMin:'',plMax:'',dyMin:'',roeMin:'',dlMax:'',liqMin:'',soPreco:false,semBanco:false}; S.sort={k:'ticker',d:1}; setTab('buscador'); }
  else if(d.tab){ e.preventDefault(); setTab(d.tab); }
  else if(d.open) openTk(d.open);
  else if(d.sort){ S.sort = S.sort.k===d.sort ? {k:d.sort,d:-S.sort.d} : {k:d.sort,d:['ticker','setor'].includes(d.sort)?1:-1}; render(); }
  else if(d.preset){ const p=PRESETS[d.preset]; S.f={mercado:S.f.mercado||'',setor:'',tipo:'',plMin:'',plMax:'',dyMin:'',roeMin:'',dlMax:'',liqMin:'',soPreco:S.f.soPreco,semBanco:false,pvpMax:null,...p}; render(); }
  else if(d.range){ S.range=d.range; render(); }
  else if(d.modo){ S.modo=d.modo; render(); }
  else if(d.simular){ S.sim.tk=d.simular; S.sim.modo='uma'; setTab('simulador'); }
  else if(d.act==='sim') readSim();
  else if(d.act==='rf'){ lerRF(); render(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f){ S.f[el.dataset.f]= el.type==='checkbox'?el.checked:el.value; render(); }
  if(el.dataset.rk){ const k=el.dataset.rk; S.rk[k]= el.type==='checkbox'?el.checked:(k==='asc'?!!el.value:el.value); render(); }
  if(/^rf-/.test(el.id)){ lerRF(); render(); return; }
  if(['s-tk','s-mes','s-ano','s-re','s-real','s-fx','s-opc','s-ir'].includes(el.id)||/^c-(tk|p)-/.test(el.id)) readSim();
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='q'){
    const btns=[...document.querySelectorAll('#sugs button')];
    if(e.key==='ArrowDown'){ sugIdx=Math.min(sugIdx+1,btns.length-1); sugs(e.target.value); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sugIdx=Math.max(sugIdx-1,0); sugs(e.target.value); e.preventDefault(); }
    else if(e.key==='Enter'){ const t=(btns[sugIdx]||btns[0]); if(t) openTk(t.dataset.open); }
    else if(e.key==='Escape') $('#sugs').hidden=true;
  }
  if(e.key==='Enter'&&e.target.closest('.filters')) e.target.blur();
  if(e.key==='Enter'&&e.target.closest('.rf-form')){ lerRF(); render(); return; }
  if(e.key==='Enter'&&e.target.closest('.sim-form')) readSim();
});
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').slice(1).toUpperCase(); if(h&&byTk(h)&&h!==S.tk){ S.tk=h; setTab('acao'); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ sugIdx=-1; sugs(e.target.value); } });


// ===================== tema claro / escuro =====================
const TEMAS=['sistema','claro','escuro'];
const ICONE={sistema:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  claro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  escuro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function aplicaTema(t,redesenha){
  const r=document.documentElement;
  if(t==='claro') r.setAttribute('data-theme','light'); else if(t==='escuro') r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
  const b=document.getElementById('tema'); if(b) b.innerHTML=ICONE[t]+'<span>'+({sistema:'Sistema',claro:'Claro',escuro:'Escuro'})[t]+'</span>';
  try{ localStorage.setItem('painel-tema',t); }catch{}
  if(redesenha&&S.rows.length) render();   // gráficos pegam as cores do tema na hora de desenhar
}
let temaAtual='sistema'; try{ temaAtual=localStorage.getItem('painel-tema')||'sistema'; }catch{}
if(!TEMAS.includes(temaAtual)) temaAtual='sistema';
aplicaTema(temaAtual,false);
document.getElementById('tema').addEventListener('click',()=>{ temaAtual=TEMAS[(TEMAS.indexOf(temaAtual)+1)%3]; aplicaTema(temaAtual,true); });
try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(temaAtual==='sistema'&&S.rows.length) render(); }); }catch{}

// ===================== início =====================
(async function(){
  try{
    const [rows,meta]=await Promise.all([getJSON('data/indicadores.json'),getJSON('data/meta.json').catch(()=>({}))]);
    S.rows=rows; S.meta=meta;
    if(!rows.some(r=>ok(r.preco))) S.f.soPreco=false;
    if((meta.com_preco||0)<50) S.f.soPreco=false;
    $('#stamp').textContent=meta.atualizado_em?`Atualizado em ${meta.atualizado_em.split(' ')[0].split('-').reverse().join('/')} · ${meta.acoes} ações`:'';
  }catch(e){ $('#app').innerHTML='<div class="card"><div class="empty">Não consegui carregar os dados ('+esc(e.message)+').</div></div>'; return; }
  getJSON('data/macro.json').then(m=>{ S.macro=m; if(S.tab==='simulador') render(); }).catch(()=>{});
  const h=(location.hash||'').slice(1).toUpperCase();
  if(h && byTk(h)){ S.tk=h; setTab('acao'); } else setTab('buscador');
})();
</script>
